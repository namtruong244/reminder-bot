name = "telegram-ios-reminder-bot"
main = "src/index.ts"
compatibility_date = "2025-02-01"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "reminder_bot_db"
database_id = "d5239e8d-660e-4a89-8f51-0ca67757173f"

# Cron Triggers:
# 1. Runs every minute to scan pending tasks and send notifications
# 2. Runs daily at 01:00 UTC (08:00 AM VN) for morning brief
[triggers]
crons = ["* * * * *", "0 1 * * *"]

[vars]
DEFAULT_TIMEZONE = "Asia/Ho_Chi_Minh"
LLM_MODEL = "gemini-2.5-flash"
